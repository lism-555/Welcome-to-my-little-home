<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Writing Desk &middot; My Little Home</title>
<meta name="description" content="The writing desk in a retro Christmas house: the fourth picture of the house, a warm wooden desk under a translucent evergreen, where a cup of coffee is waiting to be made.">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232e0d14'/%3E%3Cpath d='M16 5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.5L16 19.8 10.1 22.9l1.3-6.5L6.5 11.9l6.6-.8z' fill='%23d9b45f'/%3E%3C/svg%3E">
</head>
<body class="page page--desk" data-parent="room.html">
  <main id="main">
    <h1 class="sr-only">The Writing Desk</h1>

    <div class="stage" style="background-image:url('assets/img/wood-desk.jpg')">
      <div class="stage__tint" id="tint" data-rgb="47,70,51" style="background:rgba(47,70,51,0.7)"></div>
      <div class="stage__vig"></div>

      <p class="desk__title">Let's Make a Cup of Coffee</p>

      <div class="brew">
        <div class="brew__cup">
          <img class="brew__shot brew__shot--empty is-on" src="assets/img/coffee-cup-empty.png" alt="An empty white cup on its saucer">
          <img class="brew__shot brew__shot--full" src="assets/img/coffee-cup-full.png" alt="The cup filled with coffee">
        </div>

        <button class="brew__pick brew__pick--beans" type="button" data-kind="beans">
          <img src="assets/img/coffee-beans.png" alt="A sack of roasted coffee beans">
        </button>

        <button class="brew__pick brew__pick--sugar" type="button" data-kind="sugar">
          <img src="assets/img/coffee-sugar.png" alt="A jar of sugar cubes">
        </button>
      </div>
    </div>
  </main>

<script src="assets/js/site.js"></script>
<script src="assets/js/desk.js"></script>
</body>
</html>
